
name: LXG Studio APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LXG Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          echo "ZIP extracted successfully"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Gradle Project
        id: project
        shell: bash
        run: |
          FILE=$(find extracted -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) | head -1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle settings file missing in ZIP!"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"

      - name: Detect Gradle Version
        id: gradle
        shell: bash
        run: |
          DIR="${{ steps.project.outputs.dir }}"
          FILE="$DIR/gradle/wrapper/gradle-wrapper.properties"
          VERSION="8.13"

          if [ -f "$FILE" ]; then
            DETECTED=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*(-all|-bin)?\.zip' "$FILE" | head -1 | sed -E 's/gradle-([0-9.]+).*/\1/')
            if [ -n "$DETECTED" ]; then
              VERSION="$DETECTED"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LXG-Studio-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
