
name: LXG Studio APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LXG Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          echo "Project extracted successfully"

      - name: Fix KSP Compatibility
        shell: bash
        run: |
          FILE="extracted/gradle/libs.versions.toml"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Version catalog missing"
            exit 1
          fi

          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.2.10-2.0.2"/' "$FILE"

          grep 'googleDevtoolsKsp' "$FILE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: extracted
        run: |
          gradle --no-configuration-cache assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LXG-Studio-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
