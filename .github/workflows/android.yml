
name: LXG Studio APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LXG Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Gradle Version
        id: gradle
        shell: bash
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VERSION=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*(-all|-bin)?\.zip' gradle/wrapper/gradle-wrapper.properties | head -1 | sed -E 's/gradle-([0-9.]+).*/\1/')
          else
            VERSION=""
          fi

          if [ -z "$VERSION" ]; then
            VERSION="8.13"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Gradle $VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LXG-Studio-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
